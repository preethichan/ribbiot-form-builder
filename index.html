<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crane Job Assignment Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="form-wrapper">
            <h1>Crane Job Assignment</h1>
            <p class="form-subtitle">Complete the job details below. Additional fields will appear based on your selections.</p>
            
            <form id="jobForm">
                <div id="formFields"></div>
                
                <div class="form-actions">
                    <button type="reset" class="btn btn-secondary">Clear</button>
                    <button type="submit" class="btn btn-primary">Submit</button>
                </div>
            </form>
        </div>
    </div>

    <script src="formConfig.js"></script>
    <script src="formRenderer.js"></script>
</body>
</html>
